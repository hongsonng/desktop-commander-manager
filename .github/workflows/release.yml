name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies & Build artifacts
        run: |
          npm ci
          cargo build --workspace --release
          npm run build

      - name: Package Release Archive
        shell: pwsh
        run: |
          $ReleaseDir = "desktop-commander-manager-windows-x64"
          New-Item -ItemType Directory -Path $ReleaseDir -Force
          Copy-Item -Path "target/release/dcm-manager.exe" -Destination "$ReleaseDir/"
          Copy-Item -Path "package.json" -Destination "$ReleaseDir/"
          Copy-Item -Path "package-lock.json" -Destination "$ReleaseDir/"
          Copy-Item -Path "scripts" -Destination "$ReleaseDir/" -Recurse
          Copy-Item -Path "apps" -Destination "$ReleaseDir/" -Recurse
          Copy-Item -Path "packages" -Destination "$ReleaseDir/" -Recurse
          Compress-Archive -Path "$ReleaseDir/*" -DestinationPath "desktop-commander-manager-windows-x64.zip" -Force

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            target/release/dcm-manager.exe
            desktop-commander-manager-windows-x64.zip
          draft: false
          prerelease: false
