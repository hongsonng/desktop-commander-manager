name: CI & Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: dcm-manager-windows-x64
            binary_path: target/release/dcm-manager.exe
          - os: ubuntu-latest
            artifact_name: dcm-manager-linux-x64
            binary_path: target/release/dcm-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build Rust binaries (Release)
        run: cargo build --workspace --release

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Build TypeScript & Dashboard
        run: npm run build

      - name: Run Vitest test suite
        run: npm test

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
